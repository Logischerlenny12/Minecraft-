<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop-Start</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#f5f7ff;font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#f08a5d 0,transparent 35%),linear-gradient(160deg,#1c2452,#3b2f6b 60%,#12182f);padding:20px}
.card{max-width:560px;margin:6vh auto;padding:1.4rem;border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.04)),rgba(16,20,40,.5);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 40px rgba(0,0,0,.4)}
h1{margin:0 0 .5rem;font-size:1.5rem}p{margin:.5rem 0}.lbl{color:rgba(235,240,255,.7)}
label{display:block;margin:.7rem 0 .25rem;color:rgba(235,240,255,.7);font-size:.9rem}
input{width:100%;padding:.65rem .85rem;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:inherit;font:inherit}
button{margin-top:.9rem;min-height:46px;padding:.5rem 1.3rem;border-radius:999px;border:1px solid rgba(134,239,172,.65);background:rgba(74,222,128,.34);color:inherit;font:inherit;font-weight:650;cursor:pointer}
button.big{width:100%;min-height:58px;font-size:1.15rem}button.gray{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.14)}button:disabled{opacity:.5}
.msg{margin-top:.8rem;padding:.6rem .9rem;border-radius:14px;background:rgba(255,255,255,.1)}.msg.err{color:#fb7185}.msg.ok{color:#4ade80}
details{margin-top:.8rem}summary{cursor:pointer;color:rgba(235,240,255,.8)}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}td,th{text-align:left;padding:.25rem .3rem;border-bottom:1px solid rgba(255,255,255,.1)}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:.8rem}.bar i{display:block;height:100%;width:0;background:#4ade80;transition:width .3s}
.hide{display:none}
</style>
</head>
<body>
<div class="card" id="root"><h1>Shop-Start</h1><p class="lbl">Lade …</p></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, collection, writeBatch } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAkOOgBdY5vrYlxNZq4F0YctNANTrbXdwQ", authDomain: "minecraft-virtuell.firebaseapp.com", projectId: "minecraft-virtuell",
  storageBucket: "minecraft-virtuell.firebasestorage.app", messagingSenderId: "931259543545", appId: "1:931259543545:web:5c4ef885305d8df7501728",
});
const auth = getAuth(app), db = getFirestore(app);

/* ===== Die 50 Artikel: [Name, Preis, Lagerbestand, Minecraft-ID, Anzahl, (optional: Datenwert)] ===== */
const CATS = {
  "Waffen & Werkzeuge": [
    ["Netheriteschwert", 600, 1, "netherite_sword", 1], ["Diamantschwert", 200, 5, "diamond_sword", 1], ["Netheritespitzhacke", 700, 1, "netherite_pickaxe", 1],
    ["Diamantspitzhacke", 250, 5, "diamond_pickaxe", 1], ["Bogen", 80, 15, "bow", 1], ["Armbrust", 100, 15, "crossbow", 1], ["Dreizack", 400, 3, "trident", 1],
    ["Schild", 50, 20, "shield", 1], ["Netheriteaxt", 650, 1, "netherite_axe", 1], ["Diamantaxt", 220, 5, "diamond_axe", 1]],
  "Rüstung": [
    ["Elytra", 1500, 2, "elytra", 1], ["Netheritehelm", 550, 2, "netherite_helmet", 1], ["Netheriteharnisch", 900, 2, "netherite_chestplate", 1],
    ["Netheritehose", 800, 2, "netherite_leggings", 1], ["Netheritestiefel", 500, 2, "netherite_boots", 1], ["Diamanthelm", 180, 8, "diamond_helmet", 1],
    ["Diamantharnisch", 350, 8, "diamond_chestplate", 1], ["Diamanthose", 300, 8, "diamond_leggings", 1], ["Diamantstiefel", 180, 8, "diamond_boots", 1]],
  "Konsumgüter & Kampf-Items": [
    ["Verzauberter goldener Apfel (Notgott)", 350, 5, "enchanted_golden_apple", 1], ["Goldener Apfel (10er-Pack)", 120, 20, "golden_apple", 10],
    ["Enderperlen (30er-Pack)", 150, 30, "ender_pearl", 30], ["Totem der Unsterblichkeit", 500, 4, "totem_of_undying", 1],
    ["Gekochtes Rindfleisch (Stack / 64)", 30, 50, "cooked_beef", 64], ["Goldene Karotten (32er-Pack)", 90, 30, "golden_carrot", 32],
    ["Erfahrungsfläschchen (32er-Pack)", 75, 25, "experience_bottle", 32], ["Feuerwerksraketen für Elytra (Stack / 64)", 100, 40, "firework_rocket", 64],
    ["Wassereimer", 25, 99, "water_bucket", 1], ["Lavaeimer", 40, 50, "lava_bucket", 1]],
  "Ressourcen & Blöcke": [
    ["Obsidian (Stack / 64)", 150, 30, "obsidian", 64], ["Netheritbarren (4er-Pack)", 800, 2, "netherite_ingot", 4], ["Diamantblock (16er-Pack)", 450, 10, "diamond_block", 16],
    ["Eisenblock (Stack / 64)", 120, 40, "iron_block", 64], ["Goldblock (Stack / 64)", 180, 30, "gold_block", 64], ["Smaragdblock (16er-Pack)", 200, 15, "emerald_block", 16],
    ["TNT (16er-Pack)", 110, 25, "tnt", 16], ["Leuchtfeuer (Beacon)", 1000, 1, "beacon", 1], ["Endkristall (4er-Pack)", 250, 10, "end_crystal", 4],
    ["Spinnennetz (16er-Pack)", 60, 30, "web", 16]],
  "Gadgets & Sonstiges": [
    ["Sattel", 70, 15, "saddle", 1], ["Namensschild", 40, 20, "name_tag", 1], ["Wither-Skelett-Schädel", 300, 5, "skull", 1, 1], ["Drachenkopf", 750, 2, "dragon_head", 1],
    ["Schleimball (32er-Pack)", 50, 30, "slime_ball", 32], ["Feuerzeug (Flint and Steel)", 20, 99, "flint_and_steel", 1], ["Musikbox (Jukebox)", 90, 10, "jukebox", 1],
    ["Schallplatte (Pigstep)", 200, 5, "music_disc_pigstep", 1], ["Kürbis", 15, 99, "pumpkin", 1], ["Leine (5er-Pack)", 30, 40, "lead", 5],
    ["Namensschild (3er-Pack)", 100, 15, "name_tag", 3]],
};
const slug = (t) => t.toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
const ITEMS = Object.entries(CATS).flatMap(([category, list]) => list.map(([name, price, stock, id, n, aux]) => ({
  docId: slug(name), name, price, stock, category, commands: [`/give {player} ${id} ${n}${aux !== undefined ? " " + aux : ""}`], active: true })));

const $ = (s) => document.querySelector(s), root = $("#root");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mail = (g) => `${g.toLowerCase().replace(/[^a-z0-9]+/g, "_")}@realm-control.app`;

function loginView(msg = "") {
  root.innerHTML = `<h1>Shop-Start</h1><p class="lbl">Melde dich als Admin an, dann legst du alle ${ITEMS.length} Artikel mit einem Klick an.</p>
    <form id="f"><label for="g">Gamertag</label><input id="g" autocomplete="username" required><label for="p">Passwort</label><input id="p" type="password" autocomplete="current-password" required>
    <button class="big">Anmelden</button></form>${msg ? `<div class="msg err">${esc(msg)}</div>` : ""}`;
  $("#f").onsubmit = async (e) => {
    e.preventDefault();
    try { await signInWithEmailAndPassword(auth, mail($("#g").value.trim()), $("#p").value); }
    catch (x) { loginView({ "auth/invalid-credential": "Gamertag oder Passwort falsch." }[x.code] ?? x.message); }
  };
}

async function panel(user) {
  const me = (await getDoc(doc(db, "users", user.uid))).data();
  if (me?.role !== "admin" || me?.status !== "active") {
    root.innerHTML = `<h1>Shop-Start</h1><div class="msg err">Nur Admins dürfen das. Du bist als „${esc(me?.gamertag ?? "?")}“ angemeldet.</div><button class="gray" id="o">Abmelden</button>`;
    $("#o").onclick = () => signOut(auth); return;
  }
  const existing = (await getDocs(collection(db, "shop_items"))).size;
  root.innerHTML = `<h1>Shop-Start</h1><p>Angemeldet als <b>${esc(me.gamertag)}</b>.</p>
    <p class="lbl">Im Shop sind aktuell <b>${existing}</b> Artikel. Jetzt anlegen: <b>${ITEMS.length}</b> Artikel in ${Object.keys(CATS).length} Kategorien, jeweils mit Preis, Lagerbestand und Befehl.</p>
    ${existing ? `<div class="msg">Gleiche Artikel werden überschrieben (Lagerbestand springt auf den Startwert zurück). Andere Artikel bleiben bestehen.</div>` : ""}
    <button class="big" id="go">Start – alle ${ITEMS.length} Artikel anlegen</button><div class="bar"><i id="pr"></i></div><div id="out"></div>
    <details><summary>Alle Artikel ansehen</summary><table><tr><th>Artikel</th><th>Preis</th><th>Lager</th><th>Befehl</th></tr>${ITEMS.map((i) => `<tr><td>${esc(i.name)}</td><td>${i.price}</td><td>${i.stock}</td><td>${esc(i.commands[0])}</td></tr>`).join("")}</table></details>
    <p><button class="gray" id="o">Abmelden</button></p>`;
  $("#o").onclick = () => signOut(auth);
  $("#go").onclick = async () => {
    const b = $("#go"); b.disabled = true; b.textContent = "Wird angelegt …"; $("#pr").style.width = "30%";
    try {
      const batch = writeBatch(db);
      ITEMS.forEach(({ docId, ...data }) => batch.set(doc(db, "shop_items", docId), data));
      await batch.commit();
      $("#pr").style.width = "100%";
      $("#out").innerHTML = `<div class="msg ok">✓ Fertig! ${ITEMS.length} Artikel sind im Shop. <a href="./" style="color:#fff">Zum Dashboard</a></div>`;
      b.textContent = "Erledigt";
    } catch (e) { $("#pr").style.width = "0"; $("#out").innerHTML = `<div class="msg err">Fehler: ${esc(e.message)}</div>`; b.disabled = false; b.textContent = "Nochmal versuchen"; }
  };
}
onAuthStateChanged(auth, (u) => (u ? panel(u) : loginView()));
</script>
</body>
</html>
