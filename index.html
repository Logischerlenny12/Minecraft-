<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Realm Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--grass:#5fb947;--dirt:#5b4026;--dirt2:#4f3820;--panel:#3a3a3a;--panel2:#2e2e2e;--hi:#6a6a6a;--lo:#161616;--ink:#f2f2f2;--mute:#b0b0b0;--gold:#ffaa00;--red:#ff5555;--aqua:#55ffff;--green:#55ff55;
  --px:'Press Start 2P',monospace;--vt:'VT323','Courier New',monospace}
*{box-sizing:border-box}
body{margin:0;background:#262626;color:var(--ink);font:22px/1.2 var(--vt);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3{font-family:var(--px);font-weight:400;margin:0 0 .8rem;line-height:1.5}
h1{font-size:1.1rem}h3{font-size:.72rem;color:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:#111;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);padding:.35rem .5rem;width:100%}
textarea{min-height:90px}
button{background:#6d6d6d;border:2px solid;border-color:#a5a5a5 #333 #333 #a5a5a5;padding:.25rem .8rem;cursor:pointer;text-shadow:2px 2px #3a3a3a}
button:hover{background:#7b86c4;outline:2px solid #fff;outline-offset:-2px}
button.go{background:#3f8f2d;border-color:#7edc62 #1e4d14 #1e4d14 #7edc62}
button.go:hover{background:#4ba836}
button.bad{background:#a53030;border-color:#ee7a7a #4f1010 #4f1010 #ee7a7a}
button.sm{padding:0 .5rem;font-size:19px}
:focus-visible{outline:2px solid var(--aqua);outline-offset:1px}
label{display:block;color:var(--mute);margin:.5rem 0 .15rem}
#app{display:grid;grid-template-columns:210px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
header{grid-column:1/-1;display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:.6rem 1rem;border-bottom:8px solid var(--grass);
  background:var(--dirt);background-image:linear-gradient(45deg,var(--dirt2) 25%,transparent 25%,transparent 75%,var(--dirt2) 75%),linear-gradient(45deg,var(--dirt2) 25%,transparent 25%,transparent 75%,var(--dirt2) 75%);background-size:32px 32px;background-position:0 0,16px 16px}
.brand{font:.8rem var(--px);text-shadow:3px 3px #000}
.timer{font:.7rem var(--px);color:var(--gold);text-shadow:2px 2px #000}.timer small{color:#fff;margin-right:.5rem;font-family:var(--vt);font-size:20px}
nav{background:var(--panel2);border-right:4px solid #000;padding:.6rem;display:flex;flex-direction:column;gap:.35rem}
nav button{text-align:left}nav button.on{background:#3f8f2d;border-color:#7edc62 #1e4d14 #1e4d14 #7edc62}
nav .grp{font:.55rem var(--px);color:var(--mute);margin:.7rem 0 .2rem}
main{padding:1rem;min-width:0}
.card{background:var(--panel);border:4px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);padding:.9rem;margin-bottom:1rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.cols2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1rem;align-items:start}
.coins{font:1.7rem var(--px);color:var(--gold);text-shadow:3px 3px #000}
.stats{display:flex;gap:1.5rem;margin:0}.stats dt{color:var(--mute)}.stats dd{margin:0;font:.9rem var(--px)}
.hero{display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:space-between;align-items:flex-end}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.25rem .4rem;border-bottom:2px solid #222;vertical-align:middle}th{color:var(--mute);font-weight:400}
.pos{color:var(--green)}.neg{color:var(--red)}.lbl{color:var(--mute)}.empty{color:var(--mute)}
.tag{display:inline-block;padding:0 .4rem;border:2px solid #555;font-size:18px}.tag.r{border-color:var(--red);color:var(--red)}.tag.g{border-color:var(--green);color:var(--green)}.tag.y{border-color:var(--gold);color:var(--gold)}
.row{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.order{background:var(--panel2);border:2px solid #555;border-left:6px solid var(--gold);padding:.6rem;margin-bottom:.7rem}
.order .oh{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.cmd{display:flex;gap:.4rem;align-items:center;margin:.35rem 0}
code{flex:1;background:#000;color:var(--green);padding:.2rem .4rem;font:20px var(--vt);word-break:break-all;border:2px solid #222}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.7rem}
.item{background:var(--panel2);border:2px solid #555;padding:.7rem;display:flex;flex-direction:column;gap:.35rem}
.bar{height:14px;background:#111;border:2px solid #555;margin:.2rem 0 .5rem}.bar i{display:block;height:100%;background:var(--green)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom));display:grid;gap:.4rem;z-index:9}
#toast div{background:#000;border:2px solid #fff;padding:.4rem .8rem;max-width:90vw}#toast .ok{border-color:var(--green)}#toast .err{border-color:var(--red)}
.login{max-width:440px;margin:8vh auto;padding:1rem}
.scroll{overflow-x:auto}.warn{border-left:6px solid var(--red)}
@media (max-width:820px){#app{grid-template-columns:1fr}nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:4px solid #000}nav .grp{display:none}.cols2{grid-template-columns:1fr}body{font-size:20px}}
</style>
</head>
<body>
<div id="root"></div><div id="toast" aria-live="polite"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, collection, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, getDoc, getDocs, runTransaction, query, where, orderBy, limit, serverTimestamp, Timestamp }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAkOOgBdY5vrYlxNZq4F0YctNANTrbXdwQ", authDomain: "minecraft-virtuell.firebaseapp.com", projectId: "minecraft-virtuell",
  storageBucket: "minecraft-virtuell.firebasestorage.app", messagingSenderId: "931259543545", appId: "1:931259543545:web:5c4ef885305d8df7501728",
});
const auth = getAuth(app), db = getFirestore(app);

/* ================= State & Helfer ================= */
const CFG0 = { jail: "0 200 0", spawn: "0 100 0", minigame: "0 100 0", startCoins: 100, killReward: 25, bountyOnKill: 50 };
const S = { uid: null, me: null, view: "quick", mode: "login", authMsg: "", victim: "", users: [], tx: [], teams: [], shop: [], pun: [], bounties: [], myOrders: [], orders: [], reports: [], state: null, vote: null, ballots: [], cfg: {} };
let unsubs = [], started = false, dirty = false, firstOrders = true, busy = false;
const C = () => ({ ...CFG0, ...S.cfg });
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n ?? 0).toLocaleString("de-DE");
const rank = () => ({ player: 1, mod: 2, admin: 3 }[S.me?.role] ?? 0), isStaff = () => rank() >= 2, isAdmin = () => rank() >= 3;
const active = () => S.users.filter((u) => u.status === "active").sort((a, b) => a.gamertag.localeCompare(b.gamertag));
const uname = (id) => S.users.find((u) => u.id === id)?.gamertag ?? "?";
const date = (t) => (t?.toDate ? t.toDate().toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }) : "–");
const byTime = (a, b) => (a.createdAt?.seconds ?? 9e12) - (b.createdAt?.seconds ?? 9e12);
const q = (n) => `"${n}"`;
const clean = (t) => String(t ?? "").replace(/[\r\n"\\]/g, " ").trim().slice(0, 100);
const amt = (v) => { v = Math.floor(Number(v)); if (!(v > 0 && v <= 1e7)) throw Error("Ungültiger Betrag"); return v; };
const NAME = /^[A-Za-z0-9_ ]{1,20}$/;
const toast = (m, k = "") => { const d = document.createElement("div"); d.className = k; d.textContent = m; $("#toast").append(d); setTimeout(() => d.remove(), 4500); };
const beep = () => { try { const a = new AudioContext(), o = a.createOscillator(); o.frequency.value = 880; o.connect(a.destination); o.start(); setTimeout(() => { o.stop(); a.close(); }, 180); } catch {} };

/* ================= Befehle (zum Kopieren) ================= */
const CMD = {
  freeze: (n) => [`/inputpermission set ${q(n)} movement disabled`, `/inputpermission set ${q(n)} jump disabled`],
  unfreeze: (n) => [`/inputpermission set ${q(n)} movement enabled`, `/inputpermission set ${q(n)} jump enabled`],
  jail: (n) => [`/tp ${q(n)} ${C().jail}`],
  unjail: (n) => [`/tp ${q(n)} ${C().spawn}`],
  ghost: (a, n) => [`/effect ${q(a)} invisibility 99999 1 true`, `/tp ${q(a)} ${q(n)}`],
  unghost: (a) => [`/effect ${q(a)} clear`],
  warn: (n, r) => [`/tellraw ${q(n)} {"rawtext":[{"text":"§eVerwarnung: ${r}"}]}`],
  kick: (n, r) => [`/kick ${q(n)} ${r}`],
};
const PH = {
  protection: { label: "Schutzphase", cmds: () => ["/gamerule pvp false", "/title @a title §aSchutzphase"] },
  pvp: { label: "PVP", cmds: () => ["/gamerule pvp true", "/title @a title §cPVP aktiv!"] },
  minigame: { label: "Minigame", cmds: () => [`/tp @a ${C().minigame}`, "/title @a title §bMinigame startet"] },
};
const order = (title, commands, note = "") => addDoc(collection(db, "orders"), { kind: "staff", title, commands, note, uid: S.uid, gamertag: S.me.gamertag, status: "open", createdAt: serverTimestamp() });

/* ================= Auth ================= */
const slug = (g) => g.toLowerCase().replace(/[^a-z0-9]+/g, "_");
const mail = (g) => `${slug(g)}@realm-control.app`;
let meUnsub = null;
onAuthStateChanged(auth, (u) => {
  meUnsub?.(); stop();
  if (!u) { S.uid = null; S.me = null; render(true); return; }
  S.uid = u.uid;
  meUnsub = onSnapshot(doc(db, "users", u.uid), (d) => {
    S.me = d.exists() ? { id: d.id, ...d.data() } : null;
    if (S.me?.status === "active" && !started) { started = true; if (isStaff()) S.view = "quick"; else S.view = "wallet"; listen(); }
    render(true);
  });
});
function stop() { unsubs.forEach((f) => f()); unsubs = []; started = false; }

function listen() {
  const on = (ref, fn) => unsubs.push(onSnapshot(ref, (s) => { fn(s); render(); }, (e) => console.warn(e.code)));
  const list = (s) => s.docs.map((d) => ({ id: d.id, ...d.data() }));
  const col = (n) => collection(db, n);
  on(col("users"), (s) => (S.users = list(s)));
  on(query(col("tx"), where("uid", "==", S.uid)), (s) => (S.tx = list(s).sort((a, b) => (b.ts?.seconds ?? 9e12) - (a.ts?.seconds ?? 9e12)).slice(0, 40)));
  on(col("teams"), (s) => (S.teams = list(s)));
  on(col("shop_items"), (s) => (S.shop = list(s)));
  on(query(col("punishments"), where("active", "==", true)), (s) => (S.pun = list(s)));
  on(query(col("bounties"), where("active", "==", true)), (s) => (S.bounties = list(s)));
  on(query(col("orders"), where("uid", "==", S.uid)), (s) => (S.myOrders = list(s).sort(byTime).reverse()));
  on(doc(db, "events", "state"), (d) => (S.state = d.data() ?? null));
  on(doc(db, "events", "vote"), (d) => (S.vote = d.data() ?? null));
  on(col("events/vote/ballots"), (s) => (S.ballots = list(s)));
  if (isStaff()) {
    on(doc(db, "settings", "config"), (d) => (S.cfg = d.data() ?? {}));
    on(query(col("reports"), orderBy("createdAt", "desc"), limit(40)), (s) => (S.reports = list(s)));
    on(query(col("orders"), orderBy("createdAt", "desc"), limit(80)), (s) => {
      const before = S.orders.filter((o) => o.status === "open").length;
      S.orders = list(s);
      const now = S.orders.filter((o) => o.status === "open").length;
      if (!firstOrders && now > before) beep();
      firstOrders = false;
    });
  }
  if (isAdmin()) on(query(col("requests"), where("status", "==", "pending")), (s) => s.docs.forEach((d) => queue.push(d)) || drain());
}

/* ================= Anfragen der Spieler → Verarbeitung im Admin-Browser ================= */
async function req(type, payload = {}) {
  const ref = await addDoc(collection(db, "requests"), { type, payload, uid: S.uid, status: "pending", createdAt: serverTimestamp() });
  const un = onSnapshot(ref, (d) => { const s = d.data(); if (s?.status === "done") { toast(s.result || "Erledigt", "ok"); un(); } if (s?.status === "error") { toast(s.result || "Fehler", "err"); un(); } });
  setTimeout(() => un(), 60000);
  toast("Anfrage gesendet … wird verarbeitet, sobald ein Admin online ist.");
}
const U = (id) => doc(db, "users", id);
const addTx = (t, uid, amount, reason, type, after) => t.set(doc(collection(db, "tx")), { uid, amount, reason, type, balanceAfter: after, ts: serverTimestamp() });

const H = {
  async transfer(r) {
    const to = r.payload.to, a = amt(r.payload.amount);
    if (to === r.uid) throw Error("Nicht an dich selbst");
    return runTransaction(db, async (t) => {
      const [s1, s2] = [await t.get(U(r.uid)), await t.get(U(to))];
      if (!s2.exists() || s2.data().status !== "active") throw Error("Empfänger unbekannt");
      const b1 = s1.data().balance, b2 = s2.data().balance;
      if (b1 < a) throw Error("Nicht genug Coins");
      t.update(U(r.uid), { balance: b1 - a }); t.update(U(to), { balance: b2 + a });
      addTx(t, r.uid, -a, `Überweisung an ${s2.data().gamertag}`, "transfer", b1 - a);
      addTx(t, to, a, `Überweisung von ${s1.data().gamertag}`, "transfer", b2 + a);
      return `${a} Coins an ${s2.data().gamertag} gesendet`;
    });
  },
  async vault(r) {
    const a = amt(r.payload.amount), out = r.payload.dir === "out";
    return runTransaction(db, async (t) => {
      const us = await t.get(U(r.uid)), tid = us.data().teamId;
      if (!tid) throw Error("Du bist in keinem Team");
      const ts = await t.get(doc(db, "teams", tid)), b = us.data().balance, v = ts.data().vault;
      if (out ? v < a : b < a) throw Error(out ? "Tresor hat zu wenig" : "Nicht genug Coins");
      t.update(U(r.uid), { balance: out ? b + a : b - a }); t.update(doc(db, "teams", tid), { vault: out ? v - a : v + a });
      addTx(t, r.uid, out ? a : -a, out ? "Aus Team-Tresor" : "In Team-Tresor", "team", out ? b + a : b - a);
      return out ? `${a} Coins entnommen` : `${a} Coins eingezahlt`;
    });
  },
  async bounty(r) {
    const a = amt(r.payload.amount), tg = r.payload.target;
    if (tg === r.uid) throw Error("Kein Kopfgeld auf dich selbst");
    return runTransaction(db, async (t) => {
      const [us, ts] = [await t.get(U(r.uid)), await t.get(U(tg))];
      if (!ts.exists()) throw Error("Ziel unbekannt");
      if (us.data().teamId && us.data().teamId === ts.data().teamId) throw Error("Kein Kopfgeld auf dein Teammitglied");
      const b = us.data().balance; if (b < a) throw Error("Nicht genug Coins");
      t.update(U(r.uid), { balance: b - a }); addTx(t, r.uid, -a, `Kopfgeld auf ${ts.data().gamertag}`, "bounty", b - a);
      t.set(doc(collection(db, "bounties")), { target: tg, targetName: ts.data().gamertag, placedBy: us.data().gamertag, amount: a, active: true, createdAt: serverTimestamp() });
      return `Kopfgeld von ${a} Coins auf ${ts.data().gamertag}`;
    });
  },
  async buy(r) {
    return runTransaction(db, async (t) => {
      const [us, it] = [await t.get(U(r.uid)), await t.get(doc(db, "shop_items", String(r.payload.itemId)))];
      if (!it.exists() || !it.data().active) throw Error("Artikel nicht verfügbar");
      const b = us.data().balance, p = it.data().price; if (b < p) throw Error("Nicht genug Coins");
      const g = us.data().gamertag;
      t.update(U(r.uid), { balance: b - p }); addTx(t, r.uid, -p, `Shop: ${it.data().name}`, "shop", b - p);
      t.set(doc(collection(db, "orders")), { kind: "shop", title: `Kauf: ${it.data().name}`, gamertag: g, uid: r.uid, commands: (it.data().commands ?? []).map((c) => c.replaceAll("{player}", q(g))), note: "", status: "open", createdAt: serverTimestamp() });
      return `${it.data().name} gekauft – wird bald im Spiel geliefert`;
    });
  },
  async kill(r) {
    if (!["mod", "admin"].includes(r.role)) throw Error("Keine Berechtigung");
    const { victim, killer, bountyAmount } = r.payload, cf = C();
    const bs = killer ? (await getDocs(query(collection(db, "bounties"), where("target", "==", victim), where("active", "==", true)))).docs : [];
    return runTransaction(db, async (t) => {
      const vs = await t.get(U(victim)), ks = killer ? await t.get(U(killer)) : null;
      const live = []; for (const b of bs) { const s = await t.get(b.ref); if (s.exists() && s.data().active) live.push(s); }
      const total = live.reduce((x, s) => x + s.data().amount, 0);
      t.update(U(victim), { deaths: (vs.data().deaths ?? 0) + 1 });
      if (killer) {
        const bal = ks.data().balance + cf.killReward + total;
        t.update(U(killer), { kills: (ks.data().kills ?? 0) + 1, balance: bal });
        addTx(t, killer, cf.killReward, `Kill: ${vs.data().gamertag}`, "kill", ks.data().balance + cf.killReward);
        if (total) addTx(t, killer, total, `Kopfgeld auf ${vs.data().gamertag}`, "bounty", bal);
        live.forEach((s) => t.update(s.ref, { active: false, claimedBy: ks.data().gamertag }));
        if (bountyAmount > 0) t.set(doc(collection(db, "bounties")), { target: killer, targetName: ks.data().gamertag, placedBy: "Server", amount: bountyAmount, active: true, createdAt: serverTimestamp() });
      }
      t.set(doc(collection(db, "kills")), { victim, victimName: vs.data().gamertag, killer: killer || null, killerName: ks?.data().gamertag ?? null, by: r.gamertag, createdAt: serverTimestamp() });
      return killer ? `${vs.data().gamertag} wurde von ${ks.data().gamertag} getötet${total ? ` (Kopfgeld ${total})` : ""}` : `${vs.data().gamertag} ist gestorben`;
    });
  },
};
const queue = [];
async function drain() {
  if (busy) return; busy = true;
  while (queue.length) {
    const d = queue.shift(), ref = d.ref;
    try {
      await runTransaction(db, async (t) => { const s = await t.get(ref); if (s.data().status !== "pending") throw Error("skip"); t.update(ref, { status: "processing" }); });
    } catch { continue; }
    try {
      const r = d.data(), ru = (await getDoc(U(r.uid))).data();
      if (!ru || ru.status !== "active" || !H[r.type]) throw Error("Ungültige Anfrage");
      const result = await H[r.type]({ ...r, role: ru.role, gamertag: ru.gamertag });
      await updateDoc(ref, { status: "done", result });
    } catch (e) { await updateDoc(ref, { status: "error", result: e.message }).catch(() => {}); }
  }
  busy = false;
}

/* ================= Admin-Funktionen ================= */
async function adjust(uid, delta, reason) {
  await runTransaction(db, async (t) => {
    const s = await t.get(U(uid)), b = s.data().balance;
    if (b + delta < 0) throw Error("Guthaben würde negativ");
    t.update(U(uid), { balance: b + delta }); addTx(t, uid, delta, reason, "admin", b + delta);
  });
}
async function approve(uid) {
  const a = Number(C().startCoins) || 0;
  await updateDoc(U(uid), { status: "active" });
  if (a) await adjust(uid, a, "Startguthaben");
}
async function setPhase(phase, min, next) {
  const ph = PH[phase];
  await setDoc(doc(db, "events", "state"), { phase, label: ph.label, endsAt: min ? Timestamp.fromMillis(Date.now() + min * 60000) : null, next: next || null });
  await order(`Phase: ${ph.label}`, ph.cmds());
}

/* ================= Views ================= */
const PNAV = [["wallet", "Wallet"], ["team", "Team-Tresor"], ["bounty", "Kopfgelder"], ["shop", "Shop"], ["vote", "Abstimmung"], ["report", "Melden"], ["punish", "Strafen"]];
const userOpts = (sel = "", skipMe = false) => active().filter((u) => !(skipMe && u.id === S.uid)).map((u) => `<option value="${u.id}" ${u.id === sel ? "selected" : ""}>${esc(u.gamertag)}</option>`).join("");

function orderCard(o) {
  return `<div class="order"><div class="oh"><b>${esc(o.title)}</b><span class="lbl">${esc(o.gamertag ?? "")} · ${date(o.createdAt)}</span></div>${o.note ? `<div class="lbl">${esc(o.note)}</div>` : ""}
    ${(o.commands ?? []).map((c) => `<div class="cmd"><code>${esc(c)}</code><button class="sm" data-act="copy" data-t="${esc(c)}">Kopieren</button></div>`).join("")}
    <div class="row"><button class="sm" data-act="copyAll" data-id="${o.id}">Alle kopieren</button><button class="sm go" data-act="done" data-id="${o.id}">Fertig</button></div></div>`;
}

    const adminOnly = isAdmin() ? `
      <div class="card"><h3>Spieler verwalten</h3><div class="scroll"><table><thead><tr><th>Spieler</th><th>Rolle</th><th>Coins</th><th>Team</th></tr></thead><tbody>${active().map((u) => `<tr><td>${esc(u.gamertag)}</td>

      <div class="cols">

        <label for="cr">Grund</label><input id="cr" name="reason" required><p><button class="go">Buchen</button></p></form>

      <form class="card" data-form="shopItem"><h3>Shop-Artikel</h3><label for="sn">Name</label><input id="sn" name="name" required><label for="sp">Preis</label><input id="sp" name="price" type="number" min="1" required><label for="sc">Kategorie</label><input id="sc" name="category">
        <label for="scm">Befehle (eine Zeile je Befehl, {player} wird ersetzt)</label><textarea id="scm" name="commands" placeholder="/give {player} golden_apple 2" required></textarea><p><button class="go">Speichern</button></p>
        <div class="row">${S.shop.map((i) => `<button type="button" class="sm bad" data-act="shopDel" data-id="${esc(i.id)}">${esc(i.name)} ✕</button>`).join("")}</div></form>

      <div class="card"><h3>Letzte erledigte Aufträge</h3>${done.length ? `<table><tbody>${done.map((o) => `<tr><td>${esc(o.title)}</td><td>${esc(o.gamertag ?? "")}</td><td class="lbl">${esc(o.doneBy ?? "")}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">Noch keine.</p>`}</div>`;

/* ================= Render ================= */
function render(force) {
  const ae = document.activeElement;
  if (!force && ae && ["INPUT", "TEXTAREA", "SELECT"].includes(ae.tagName)) { dirty = true; return; }
  dirty = false;
  const open = S.orders.filter((o) => o.status === "open").length;
  document.title = (open ? `(${open}) ` : "") + "Realm Control";
  if (!S.uid) return loginView();
  if (!S.me) return ($("#root").innerHTML = `<div class="login card"><h1>Realm Control</h1><p>Konto wird geladen …</p></div>`);
  if (S.me.status !== "active") return ($("#root").innerHTML = `<div class="login card"><h1>Realm Control</h1><p>${S.me.status === "rejected" ? "Deine Anmeldung wurde abgelehnt." : `Hallo <b>${esc(S.me.gamertag)}</b>! Dein Konto wartet auf Freischaltung durch einen Admin.`}</p><p><button data-act="logout">Abmelden</button></p></div>`);
  const navBtn = ([k, l]) => `<button data-act="nav" data-v="${k}" class="${S.view === k ? "on" : ""}">${l}</button>`;
  const nav = (isStaff() ? `<div class="grp">ADMIN</div>${navBtn(["quick", "Schnellansicht"])}${navBtn(["full", "Vollansicht"])}<div class="grp">PORTAL</div>` : "") + PNAV.map(navBtn).join("") + `<div class="grp"></div><button data-act="logout">Abmelden</button>`;
  const v = (S.view === "quick" || S.view === "full") && !isStaff() ? "wallet" : S.view;
  $("#root").innerHTML = `<div id="app"><header><span class="brand">Realm Control</span><span class="timer" id="timer"></span><span><b>${esc(S.me.gamertag)}</b> <span class="tag">${esc(S.me.role)}</span></span></header><nav>${nav}</nav><main>${(V[v] || V.wallet)()}</main></div>`;
  tick();
}
function loginView() {
  const reg = S.mode === "register";
  $("#root").innerHTML = `<form class="login card" data-form="auth"><h1>Realm Control</h1><div class="row"><button type="button" class="${reg ? "" : "go"}" data-act="mode" data-m="login">Anmelden</button><button type="button" class="${reg ? "go" : ""}" data-act="mode" data-m="register">Registrieren</button></div>
    <label for="gt">Gamertag</label><input id="gt" name="gamertag" autocomplete="username" required><label for="pw">Passwort (mind. 6 Zeichen)</label><input id="pw" name="password" type="password" minlength="6" autocomplete="${reg ? "new-password" : "current-password"}" required>
    <p><button class="go">${reg ? "Konto erstellen" : "Anmelden"}</button></p><p class="neg">${esc(S.authMsg)}</p>${reg ? '<p class="lbl">Nach der Registrierung schaltet ein Admin dein Konto frei.</p>' : ""}</form>`;
}
document.addEventListener("focusout", () => { if (dirty) setTimeout(() => render(), 80); });
function tick() {
  const el = $("#timer"), s = S.state; if (!el) return;
  if (!s) { el.textContent = ""; return; }
  const left = s.endsAt?.toMillis ? Math.max(0, Math.round((s.endsAt.toMillis() - Date.now()) / 1000)) : null;
  el.innerHTML = `<small>${esc(s.label ?? "")}</small>${left === null ? "" : String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0")}`;
  if (isAdmin() && left === 0 && s.next && PH[s.next] && !tick.busy) { tick.busy = true; setPhase(s.next, 0, null).finally(() => (tick.busy = false)); }
}
setInterval(tick, 1000);

/* ================= Klicks ================= */
const copy = async (t) => { try { await navigator.clipboard.writeText(t); } catch { const a = document.createElement("textarea"); a.value = t; document.body.append(a); a.select(); document.execCommand("copy"); a.remove(); } toast("Kopiert", "ok"); };
const ask = (t) => prompt(t)?.trim();
const user = (id) => S.users.find((u) => u.id === id);
const pun = (u, type, reason) => addDoc(collection(db, "punishments"), { uid: u.id, gamertag: u.gamertag, type, reason, by: S.me.gamertag, active: true, createdAt: serverTimestamp() });
const ACT = {
  nav: (b) => { S.view = b.dataset.v; render(true); },
  mode: (b) => { S.mode = b.dataset.m; S.authMsg = ""; render(true); },
  logout: () => signOut(auth),
  copy: (b) => copy(b.dataset.t),
  copyAll: (b) => copy((S.orders.find((o) => o.id === b.dataset.id)?.commands ?? []).join("\n")),
  done: (b) => updateDoc(doc(db, "orders", b.dataset.id), { status: "done", doneAt: serverTimestamp(), doneBy: S.me.gamertag }),
  approve: (b) => approve(b.dataset.id).then(() => toast("Freigeschaltet", "ok")),
  reject: (b) => updateDoc(U(b.dataset.id), { status: "rejected" }),
  buy: (b) => req("buy", { itemId: b.dataset.id }),
  vote: (b) => setDoc(doc(db, "events", "vote", "ballots", S.uid), { option: b.dataset.id, round: S.vote.round }).then(() => toast("Stimme gespeichert", "ok")),
  victim: (b) => { S.victim = b.dataset.id; toast(`${user(b.dataset.id).gamertag} als „gestorben“ vorgewählt`); render(true); },
  freeze: (b) => { const u = user(b.dataset.id); order(`Freeze: ${u.gamertag}`, CMD.freeze(u.gamertag)); },
  unfreeze: (b) => { const u = user(b.dataset.id); order(`Auftauen: ${u.gamertag}`, CMD.unfreeze(u.gamertag)); },
  jail: async (b) => { const u = user(b.dataset.id), r = clean(ask(`Grund für Knast (${u.gamertag})?`)); if (!r) return; await pun(u, "jail", r); order(`Knast: ${u.gamertag}`, CMD.jail(u.gamertag), r); },
  unjail: async (b) => { const u = user(b.dataset.id); for (const p of S.pun.filter((p) => p.uid === u.id && p.type === "jail")) await updateDoc(doc(db, "punishments", p.id), { active: false }); order(`Knast beenden: ${u.gamertag}`, CMD.unjail(u.gamertag)); },
  warn: async (b) => { const u = user(b.dataset.id), r = clean(ask(`Grund der Verwarnung (${u.gamertag})?`)); if (!r) return; await pun(u, "warn", r); order(`Warnung: ${u.gamertag}`, CMD.warn(u.gamertag, r), r); },
  kick: (b) => { const u = user(b.dataset.id), r = clean(ask("Grund (optional)?") ?? ""); order(`Kick: ${u.gamertag}`, CMD.kick(u.gamertag, r), r); },
  ban: async (b) => { const u = user(b.dataset.id), r = clean(ask(`Grund für Bann (${u.gamertag})?`)); if (!r) return; await pun(u, "ban", r); order(`Bann: ${u.gamertag}`, CMD.kick(u.gamertag, "Gebannt: " + r), "Zusätzlich im Realm unter Mitglieder sperren."); },
  ghost: (b) => { const u = user(b.dataset.id); order(`Ghost zu ${u.gamertag}`, CMD.ghost(S.me.gamertag, u.gamertag)); },
  unghost: () => order("Wieder sichtbar", CMD.unghost(S.me.gamertag)),
  airdrop: () => order("Mystery-Drop", ["/loot spawn ~ ~ ~ loot \"chests/simple_dungeon\"", "/title @a title §6Airdrop gelandet!"], "Stell dich dorthin, wo der Drop landen soll."),
  punEnd: async (b) => { const p = S.pun.find((x) => x.id === b.dataset.id); await updateDoc(doc(db, "punishments", p.id), { active: false }); if (p.type === "jail") order(`Knast beenden: ${p.gamertag}`, CMD.unjail(p.gamertag)); },
  repDone: (b) => updateDoc(doc(db, "reports", b.dataset.id), { status: "done" }),
  shopDel: (b) => confirm("Artikel löschen?") && deleteDoc(doc(db, "shop_items", b.dataset.id)),
  voteClose: () => updateDoc(doc(db, "events", "vote"), { open: false }),
};
document.addEventListener("click", (e) => { const b = e.target.closest("[data-act]"); if (b && ACT[b.dataset.act]) { e.preventDefault(); Promise.resolve(ACT[b.dataset.act](b)).catch((x) => toast(x.message, "err")); } });
document.addEventListener("change", (e) => { const s = e.target.closest("[data-role]"); if (s && isAdmin()) updateDoc(U(s.dataset.role), { role: s.value }).then(() => toast("Rolle geändert", "ok")); });

/* ================= Formulare ================= */
const xyz = (v) => { if (!/^-?\d+ -?\d+ -?\d+$/.test(v.trim())) throw Error("Koordinaten als „x y z“ angeben"); return v.trim(); };
const FORM = {
  async auth(f) {
    const g = f.gamertag.value.trim(), p = f.password.value; S.authMsg = "";
    try {
      if (S.mode === "register") {
        if (!NAME.test(g)) throw Error("Gamertag: nur Buchstaben, Zahlen, Leerzeichen, _ (max. 20)");
        const c = await createUserWithEmailAndPassword(auth, mail(g), p);
        await setDoc(U(c.user.uid), { gamertag: g, role: "player", status: "pending", balance: 0, kills: 0, deaths: 0, teamId: null, createdAt: serverTimestamp() });
      } else await signInWithEmailAndPassword(auth, mail(g), p);
    } catch (e) { S.authMsg = { "auth/email-already-in-use": "Dieser Gamertag ist schon registriert.", "auth/invalid-credential": "Gamertag oder Passwort falsch.", "auth/weak-password": "Passwort zu kurz." }[e.code] ?? e.message; loginView(); }
  },
  transfer: (f) => req("transfer", { to: f.to.value, amount: +f.amount.value }),
  vault: (f, e) => req("vault", { dir: e.submitter?.value || "in", amount: +f.amount.value }),
  bounty: (f) => req("bounty", { target: f.target.value, amount: +f.amount.value }),
  async report(f) { await addDoc(collection(db, "reports"), { uid: S.uid, reporterName: S.me.gamertag, target: f.target.value, targetName: uname(f.target.value), reason: f.reason.value, text: f.text.value.trim(), status: "open", createdAt: serverTimestamp() }); toast("Meldung gesendet", "ok"); },
  death: (f) => { S.victim = ""; return req("kill", { victim: f.victim.value, killer: f.killer.value || null, bountyAmount: f.killer.value && f.bo.checked ? Math.max(0, Math.floor(+f.ba.value || 0)) : 0 }); },
  broadcast: (f) => order("Broadcast", [...(f.sub.value.trim() ? [`/title @a subtitle ${clean(f.sub.value)}`] : []), `/title @a title ${clean(f.title.value)}`]),
  clear: (f) => order(`Item entfernen: ${uname(f.uid.value)}`, [`/clear ${q(uname(f.uid.value))} ${f.item.value.trim()}`]),
  coins: async (f) => { await adjust(f.uid.value, Math.floor(+f.amount.value), clean(f.reason.value)); toast("Gebucht", "ok"); },
  phase: (f) => setPhase(f.phase.value, Math.max(0, +f.min.value || 0), f.next.value),
  async voteStart(f) { const options = Object.fromEntries(f.opts.value.split(",").map((s) => s.trim()).filter(Boolean).map((l) => [slug(l), l])); await setDoc(doc(db, "events", "vote"), { open: true, round: (S.vote?.round ?? 0) + 1, options }); toast("Abstimmung gestartet", "ok"); },
  async team(f) {
    if (f.a.value === f.b.value) throw Error("Zwei verschiedene Spieler wählen");
    const ref = await addDoc(collection(db, "teams"), { name: f.name.value.trim(), members: [f.a.value, f.b.value], vault: 0 });
    await updateDoc(U(f.a.value), { teamId: ref.id }); await updateDoc(U(f.b.value), { teamId: ref.id }); toast("Team erstellt", "ok");
  },
  async shopItem(f) { await setDoc(doc(db, "shop_items", slug(f.name.value)), { name: f.name.value.trim(), price: +f.price.value, category: f.category.value.trim(), commands: f.commands.value.split("\n").map((s) => s.trim()).filter(Boolean), active: true }); toast("Artikel gespeichert", "ok"); },
  async cfg(f) { await setDoc(doc(db, "settings", "config"), { jail: xyz(f.jail.value), spawn: xyz(f.spawn.value), minigame: xyz(f.minigame.value), startCoins: +f.startCoins.value, killReward: +f.killReward.value, bountyOnKill: +f.bountyOnKill.value }); toast("Gespeichert", "ok"); },
};
document.addEventListener("submit", async (e) => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  try { await FORM[f.dataset.form](f, e); if (!["auth", "cfg"].includes(f.dataset.form)) f.reset?.(); } catch (x) { toast(x.message, "err"); }
});
render(true);
</script>
</body>
</html>
